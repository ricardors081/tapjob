# Virtual uv workspace root: holds shared Python tooling configuration and the single lockfile.
# It is not an installable package itself.

[tool.uv.workspace]
members = ["services/api", "services/worker", "packages/product-config"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["node_modules"]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle
  "W",
  "F",     # pyflakes
  "I",     # isort
  "N",     # pep8-naming
  "UP",    # pyupgrade
  "B",     # bugbear
  "S",     # bandit security checks
  "SIM",
  "RUF",
  "PTH",
  "DTZ",   # naive datetimes (timestamps must be timezone-aware UTC)
  "T20",   # no print() in runtime code
]

[tool.ruff.lint.isort]
known-first-party = ["tapjob_api", "tapjob_worker", "tapjob_product_config"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is `param: T = Depends(provider)` -- a call in a default
# argument that bugbear's B008 would otherwise (correctly, for ordinary code) flag as a mutable/
# re-evaluated default. FastAPI special-cases Depends/Security itself (re-resolved per request, not
# evaluated once at function-definition time), so this is the standard, documented way to silence
# B008 for exactly these two calls (WP1.1, docs/adr/0009-identity-auth-user-account.md) -- not a
# blanket B008 disable.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.params.Depends",
  "fastapi.Security",
  "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
# S101: pytest `assert` is the standard assertion mechanism, not a stripped-in-production hazard.
# S106: every test fixture passes a literal, non-secret string into a `token=`/`subject=`-named
# parameter (WP1.1 fake-identity helpers); none of these touch a real credential.
"**/tests/**" = ["S101", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = [
  "services/api/src",
  "services/api/tests",
  "services/worker/src",
  "services/worker/tests",
  "packages/product-config/src",
  "packages/product-config/tests",
  "tools/agent_factory",
]
explicit_package_bases = true
mypy_path = [
  "services/api/src",
  "services/api/tests",
  "services/worker/src",
  "packages/product-config/src",
  ".",
]

[[tool.mypy.overrides]]
# Celery ships without type information.
module = ["celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# boto3/botocore ship without inline type stubs (WP1.3, docs/adr/0011-resume-import.md).
# tapjob_api.resume_import.storage is the ONLY module that imports them, so this gap stays
# contained to one small, reviewable adapter file -- same precedent as firebase-admin below.
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# docx (python-docx) ships without inline type stubs (WP1.3). tapjob_api.resume_import.extraction
# is the ONLY module that imports it.
module = ["docx", "docx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# firebase-admin ships without a py.typed marker (WP1.1, docs/adr/0009-identity-auth-user-
# account.md). tapjob_api.identity.firebase is the ONLY module that imports it, so this gap stays
# contained to one small, reviewable adapter file.
module = ["firebase_admin", "firebase_admin.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = [
  "services/api/tests",
  "services/worker/tests",
  "packages/product-config/tests",
]
addopts = ["--strict-markers", "--import-mode=importlib", "-m", "not integration"]
# Lets test files do a plain `import identity_fakes` for the shared WP1.1 test double
# (services/api/tests/identity_fakes.py) instead of a package-relative import --
# `--import-mode=importlib` alone does not put a test file's own directory on sys.path.
pythonpath = ["services/api/tests"]
markers = [
  "integration: requires real infrastructure (PostgreSQL, Redis); run with `pytest -m integration`",
]

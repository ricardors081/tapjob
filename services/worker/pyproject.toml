[project]
name = "tapjob-worker"
version = "0.1.0"
description = "Celery worker process for Career Core asynchronous jobs."
requires-python = ">=3.12"
# The worker runs domain code from the modular-monolith backend package, so it depends on it
# rather than duplicating configuration/logging foundations.
dependencies = [
  "celery[redis]>=5.6.3",
  "pydantic>=2.13.5",
  "sentry-sdk[celery]>=2.71.0",
  "tapjob-api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tapjob_worker"]

[tool.uv.sources]
tapjob-api = { workspace = true }

[project]
name = "tapjob-api"
version = "0.1.0"
description = "Career Core backend: FastAPI HTTP service, shared runtime foundations and database migrations."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.20.0",
  "fastapi>=0.142.2",
  "psycopg[binary]>=3.3.6",
  "pydantic-settings>=2.15.0",
  "redis>=6.4.0",
  "sentry-sdk[fastapi]>=2.71.0",
  "sqlalchemy>=2.1.1",
  "tapjob-product-config",
  "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tapjob_api"]

[tool.uv.sources]
tapjob-product-config = { workspace = true }

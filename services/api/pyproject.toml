[project]
name = "tapjob-api"
version = "0.1.0"
description = "Career Core backend: FastAPI HTTP service, shared runtime foundations and database migrations."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.20.0",
  "boto3>=1.43.108",
  "celery[redis]>=5.6.3",
  "fastapi>=0.142.2",
  "firebase-admin>=7.2.0",
  "opentelemetry-api>=1.45.1",
  "psycopg[binary]>=3.3.6",
  "pydantic-settings>=2.15.0",
  "pypdf>=6.21.0",
  "python-docx>=1.2.0",
  "python-multipart>=0.0.32",
  "redis>=8.1.0",
  "sentry-sdk[fastapi]>=2.71.0",
  "sqlalchemy>=2.1.1",
  "tapjob-product-config",
  "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tapjob_api"]

[tool.uv.sources]
tapjob-product-config = { workspace = true }

[project]
name = "tapjob-product-config"
version = "0.1.0"
description = "Typed loader for the canonical product identity file (product.json)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tapjob_product_config"]

# Ship the canonical product.json inside the wheel so container images do not depend on the
# repository layout.
[tool.hatch.build.targets.wheel.force-include]
"product.json" = "tapjob_product_config/product.json"

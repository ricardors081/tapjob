name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Third-party actions are pinned to full commit SHAs (Dependabot keeps them current).
permissions:
  contents: read

env:
  # Same uv release as infra/docker/backend.Dockerfile; bump both together.
  UV_VERSION: "0.12.21"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  backend-integration:
    name: Backend integration (PostgreSQL migrations, readiness)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tapjob
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: tapjob_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tapjob -d tapjob_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://tapjob:ci-only-password@localhost:5432/tapjob_ci
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --all-packages
      - run: uv run pytest -m integration

  contracts:
    name: Contracts (OpenAPI export, client generation, drift check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --all-packages
      - name: Export the OpenAPI schema and check for drift
        # Offline/deterministic (docs/adr/0003-api-contract-client-generation.md): no DATABASE_URL/
        # REDIS_URL needed, nothing is connected to.
        run: |
          uv run python -m tapjob_api.openapi_export
          git diff --exit-code -- packages/contracts/openapi.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate the TypeScript client and check for drift
        run: |
          npm run generate --workspace @tapjob/contracts
          git diff --exit-code -- packages/contracts/src/generated
      - run: npm run typecheck --workspace @tapjob/contracts
      # Error/pagination handling itself is tested in the backend job; this is the Hey API
      # generator fixture/regression suite (test/generator-fixtures.test.mjs).
      - run: npm run test --workspace @tapjob/contracts

  packages:
    name: Shared packages (lint, format, tokens, product config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run tokens:check
      - run: npm run typecheck
      - run: npm test

  mobile:
    name: Mobile (Expo Doctor, bundle export)
    runs-on: ubuntu-latest
    env:
      # Only used to prove the shell boots/exports; no real backend is reachable in this job.
      EXPO_PUBLIC_APP_ENV: development
      EXPO_PUBLIC_API_BASE_URL: https://api.example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Expo Doctor
        working-directory: apps/mobile
        run: npx expo-doctor
      - name: Export the shell bundle (proves it actually builds)
        working-directory: apps/mobile
        run: npx expo export --platform android --platform ios

  docker:
    name: Docker build and compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare local environment file
        run: cp infra/.env.example infra/.env
      - name: Build images
        run: docker compose -f infra/compose.yaml build
      - name: Start stack
        run: docker compose -f infra/compose.yaml up --detach --wait --wait-timeout 180 postgres redis api worker
      - name: Health and readiness checks through published port
        run: |
          set -a; . infra/.env; set +a
          curl --fail --silent --show-error "http://127.0.0.1:${API_HOST_PORT}/health"
          curl --fail --silent --show-error "http://127.0.0.1:${API_HOST_PORT}/ready"
      - name: Show logs on failure
        if: failure()
        run: docker compose -f infra/compose.yaml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f infra/compose.yaml down --volumes

  security:
    name: Secret scan and dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action lists the pull request's commits to scan them.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --all-packages
      - name: Python dependency audit (pip-audit pinned in uv.lock)
        # The export is fully pinned, so pip-audit audits it as-is (--no-deps --disable-pip) instead
        # of re-resolving with pip.
        run: |
          uv export --locked --all-packages --no-emit-workspace --no-hashes --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uv run --locked pip-audit --strict --no-deps --disable-pip --requirement "$RUNNER_TEMP/requirements.txt"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: npm dependency audit
        run: npm audit --audit-level=high

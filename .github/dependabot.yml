# Controlled dependency update PRs (FOUNDATION_DECISIONS §8). Never auto-merge major updates.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
